# circleguard-promotion-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      containers:
      - name: promotion-service
        image: promotion-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8088
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_promotion
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: broker:9092
        - name: SPRING_NEO4J_URI
          value: bolt://graph-db:7687
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: taller2-stage
spec:
  selector:
    app: promotion-service
  ports:
  - port: 8088
    targetPort: 8088
