# circleguard-gateway-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: gateway-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx512m -Xms256m"
        - name: SPRING_DATA_REDIS_HOST
          value: redis
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8087
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: taller2-stage
spec:
  selector:
    app: gateway-service
  ports:
  - port: 8087
    targetPort: 8087
---
