# circleguard-notification-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_notification
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: broker:9092
        - name: MANAGEMENT_HEALTH_MAIL_ENABLED
          value: "false"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "768Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: taller2-stage
spec:
  selector:
    app: notification-service
  ports:
  - port: 8082
    targetPort: 8082
