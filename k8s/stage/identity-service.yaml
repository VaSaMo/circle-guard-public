# circleguard-identity-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: identity-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx512m -Xms256m"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_identity
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: taller2-stage
spec:
  selector:
    app: identity-service
  ports:
  - port: 8083
    targetPort: 8083
---
