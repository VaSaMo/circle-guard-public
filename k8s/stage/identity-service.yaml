# circleguard-identity-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_identity
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: taller2-stage
spec:
  selector:
    app: identity-service
  ports:
  - port: 8083
    targetPort: 8083
---
