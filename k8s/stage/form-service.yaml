# circleguard-form-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: form-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: form-service
  template:
    metadata:
      labels:
        app: form-service
    spec:
      containers:
      - name: form-service
        image: form-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8086
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx384m -Xms256m"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_form
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: broker:9092
        resources:
          requests:
            memory: "384Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8086
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: form-service
  namespace: taller2-stage
spec:
  selector:
    app: form-service
  ports:
  - port: 8086
    targetPort: 8086
