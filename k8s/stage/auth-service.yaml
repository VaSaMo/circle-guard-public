# circleguard-auth-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8180
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx512m -Xms256m"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_auth
        - name: SPRING_LDAP_URLS
          value: ldap://openldap:389
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8180
          initialDelaySeconds: 45
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taller2-stage
spec:
  selector:
    app: auth-service
  ports:
  - port: 8180
    targetPort: 8180
---
