# circleguard-auth-service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: taller2-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8180
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/circleguard_auth
        - name: SPRING_LDAP_URLS
          value: ldap://openldap:389
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: taller2-stage
spec:
  selector:
    app: auth-service
  ports:
  - port: 8180
    targetPort: 8180
---
