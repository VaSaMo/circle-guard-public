apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: taller2-prod
data:
  init-db.sql: |
    -- Initialize required microservice databases
    CREATE DATABASE circleguard_auth;
    CREATE DATABASE circleguard_identity;
    CREATE DATABASE circleguard_promotion;
    CREATE DATABASE circleguard_dashboard;
    CREATE DATABASE circleguard_form;
    CREATE DATABASE circleguard_notification;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: taller2-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_DB
          value: postgres
        - name: POSTGRES_USER
          value: admin
        - name: POSTGRES_PASSWORD
          value: password
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - admin
            - -d
            - postgres
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: taller2-prod
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
